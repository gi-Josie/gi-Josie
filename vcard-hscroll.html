.post { font-family: Eras ITC, sans-serif;

.main-col { width: 650px;
            margin: 0 auto 0 auto; }

.vcard { width: 400px;
         height: 477px;
         margin: 20px auto 0 auto;
         border: 1px solid #000;
         border-radius: 10px;
          }

.card-header {
    padding: 20px 22px 16px;
    display: flex;
    align-items: center;
    gap: 16px;
    border-bottom: 1px solid #000;
}

.avatar {
    width: 100px;
    height: 85px;
    border-radius: 50%;
    overflow: hidden;
    border: 2px solid var(--accent);
    flex-shrink: 0;
}

.identity {
    flex: 1;
    flex-grow: 1;
    flex-shrink: 1;
    flex-basis: 0%;
}

.card-body { padding: 20px; }

.logo { padding: 20px 0 5px 0;
        float: left;
        /*position: fixed;*/ }

.download { padding: 5px 10px 5px 10px;
          font-family: Eras ITC, sans-serif;
          border: 1px solid #cbcbcb;
          border-radius: 50px;
          background-color: #292828;
          margin: 50px; }

.download:hover { background-color: #000; }

.nav { padding: 0 0 5px 20px;
        /*position: fixed;*/ }

.hero { padding: 10px; }

.title { padding: 5px 5px 20px 0;
         float: right; }

.end { margin: 10px auto 10px auto; }

.note { /*width: 450px;*/
    padding: 20px;
    margin: 0 auto 0 auto;
    text-align: justify;
    border: 1px dashed #cbcbcb;
    background-color: #292828; }

.button { width: 25px;
          border: 1px solid #cbcbcb;
          border-radius: 50px;
          background-color: #292828;
          padding: 5px 10px 5px 10px;
          font-family: Eras ITC, sans-serif;;
        }

.button:hover { background-color: #000; }

a {
  color: #3cb73c;
  text-decoration: none;
  transition: all 0.5s ease-in-out;
}

a:hover {
  color: #FFBE1E;
  text-decoration: none;
  transition: all 0.5s ease-in-out;
  /*font-weight: bold;*/
}

.sig { margin: 30px auto 10px auto; }

.f-r { float: right; }

.subhead { color: #0e89f3;
           font-weight: bold; }

.photo-label { font-size: 12px;
               margin-top: -5px; }

.section-title {
    font-size: 0.9rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: #000;
    margin-bottom: 8px;
}

.scroll {
            margin: 20px auto;
            padding: 15px;
            max-width: 2860px;
            height: 477px;
            overflow-x: auto;
            overflow-y: hidden;
            white-space: nowrap;
            /*border: 1px dashed #cbcbcb;*/
            position: relative;
            top: 200px;
